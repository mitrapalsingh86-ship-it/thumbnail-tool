
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Mitrapal - Thumbnail Maker</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#101426;
color:white;
padding:15px;
}

header{
text-align:center;
padding:20px 5px;
}

header h1{
font-size:27px;
color:#55e6c1;
}

header p{
color:#b8c4e0;
margin-top:8px;
font-size:14px;
}

.app{
max-width:1000px;
margin:auto;
background:#1b2340;
border:1px solid #344365;
border-radius:18px;
padding:18px;
}

h3{
margin:15px 0 10px;
color:#55e6c1;
}

label{
display:block;
font-size:14px;
margin:12px 0 6px;
}

input,select,button{
font:inherit;
}

input[type="text"],
input[type="number"],
select{
width:100%;
padding:11px;
border:1px solid #465477;
background:#101a34;
color:white;
border-radius:8px;
outline:none;
}

input[type="file"]{
width:100%;
background:#101a34;
padding:10px;
border-radius:8px;
color:white;
}

input[type="color"]{
width:100%;
height:40px;
border:none;
background:transparent;
}

input[type="range"]{
width:100%;
accent-color:#55e6c1;
}

.editor{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:15px;
}

.panel{
background:#252f50;
padding:15px;
border-radius:12px;
}

.preview{
background:#111;
border-radius:12px;
padding:8px;
margin-top:15px;
}

canvas{
width:100%;
height:auto;
display:block;
border-radius:5px;
}

button{
border:none;
padding:13px;
border-radius:9px;
cursor:pointer;
font-weight:bold;
}

.download{
width:100%;
background:linear-gradient(90deg,#55e6c1,#00b894);
color:#102033;
margin-top:15px;
font-size:16px;
}

.reset{
width:100%;
background:#475675;
color:white;
margin-top:8px;
}

button:hover{
filter:brightness(1.12);
}

.note{
font-size:12px;
color:#b6c3df;
margin-top:10px;
line-height:1.6;
}

@media(max-width:700px){
.editor{grid-template-columns:1fr}
header h1{font-size:23px}
.app{padding:12px}
}
</style>
</head>

<body>

<header>
<h1>🎨 DIGITAL MITRAPAL</h1>
<p>Professional YouTube Thumbnail Maker</p>
</header>

<div class="app">

<div class="preview">
<canvas id="canvas" width="1280" height="720"></canvas>
</div>

<div class="editor">

<div class="panel">

<h3>📸 Upload Images</h3>

<label>Upload Background Photo</label>
<input type="file" id="bgUpload" accept="image/*">

<label>Upload Your Photo</label>
<input type="file" id="personUpload" accept="image/*">

<h3>✍️ Thumbnail Text</h3>

<label>Main Heading</label>
<input type="text" id="heading"
value="अपना AI TOOL बनाएं">

<label>Second Heading</label>
<input type="text" id="subheading"
value="बिना एक रुपया खर्च किए!">

<label>Third Heading</label>
<input type="text" id="third"
value="ONLINE EARNING">

<h3>🎨 Text Design</h3>

<label>Main Text Color</label>
<input type="color" id="mainColor" value="#ffff00">

<label>Second Text Color</label>
<input type="color" id="subColor" value="#ffffff">

<label>Third Text Color</label>
<input type="color" id="thirdColor" value="#00ffcc">

<label>Text Size</label>
<input type="range" id="fontSize"
min="35" max="110" value="75">

<label>Text Outline Color</label>
<input type="color" id="outlineColor" value="#000000">

<label>Text Outline Width</label>
<input type="range" id="outlineWidth"
min="0" max="15" value="6">

</div>

<div class="panel">

<h3>⚙️ Layout Settings</h3>

<label>Background Color</label>
<input type="color" id="bgColor" value="#172554">

<label>Heading Position</label>
<input type="range" id="headingY"
min="100" max="650" value="280">

<label>Second Text Position</label>
<input type="range" id="subY"
min="100" max="680" value="400">

<label>Third Text Position</label>
<input type="range" id="thirdY"
min="100" max="680" value="520">

<label>Text Horizontal Position</label>
<input type="range" id="textX"
min="100" max="1180" value="640">

<label>Font Style</label>
<select id="fontStyle">
<option value="Arial">Arial</option>
<option value="Impact">Impact</option>
<option value="Georgia">Georgia</option>
<option value="Verdana">Verdana</option>
</select>

<label>Person Image Size</label>
<input type="range" id="personSize"
min="100" max="650" value="420">

<label>Person Image Horizontal Position</label>
<input type="range" id="personX"
min="0" max="1280" value="1050">

<label>Person Image Vertical Position</label>
<input type="range" id="personY"
min="0" max="720" value="600">

<label>Text Alignment</label>
<select id="align">
<option value="center">Center</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>

<p class="note">
अपनी फोटो और बैकग्राउंड लगाकर टेक्स्ट को अपनी पसंद के अनुसार सेट करें।
</p>

<button class="reset" onclick="resetTool()">
↻ Reset Design
</button>

<button class="download" onclick="downloadImage()">
⬇ Download Thumbnail PNG
</button>

</div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let bgImage=null;
let personImage=null;

const ids=[
"heading","subheading","third",
"mainColor","subColor","thirdColor",
"fontSize","outlineColor","outlineWidth",
"bgColor","headingY","subY","thirdY",
"textX","fontStyle","personSize",
"personX","personY","align"
];

function get(id){
return document.getElementById(id);
}

function loadImage(file,callback){
if(!file)return;
const reader=new FileReader();

reader.onload=e=>{
const img=new Image();
img.onload=()=>callback(img);
img.src=e.target.result;
};

reader.readAsDataURL(file);
}

get("bgUpload").addEventListener("change",e=>{
loadImage(e.target.files[0],img=>{
bgImage=img;
draw();
});
});

get("personUpload").addEventListener("change",e=>{
loadImage(e.target.files[0],img=>{
personImage=img;
draw();
});
});

function coverImage(img,x,y,w,h){
const scale=Math.max(w/img.width,h/img.height);
const sw=w/scale;
const sh=h/scale;
const sx=(img.width-sw)/2;
const sy=(img.height-sh)/2;

ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}

function drawText(text,y,color,size,x){
if(!text)return;

ctx.save();
ctx.font="bold "+size+"px "+get("fontStyle").value;
ctx.textAlign=get("align").value;
ctx.textBaseline="middle";
ctx.lineJoin="round";

ctx.lineWidth=Number(get("outlineWidth").value);
ctx.strokeStyle=get("outlineColor").value;
ctx.fillStyle=color;

ctx.shadowColor="rgba(0,0,0,0.5)";
ctx.shadowBlur=5;
ctx.shadowOffsetY=4;

const maxWidth=1100;

const words=text.split(" ");
const lines=[];
let line="";

for(const word of words){
const test=line?line+" "+word:word;

if(ctx.measureText(test).width>maxWidth && line){
lines.push(line);
line=word;
}else{
line=test;
}
}

if(line)lines.push(line);

const lineHeight=size*1.15;
const startY=y-((lines.length-1)*lineHeight)/2;

lines.forEach((t,i)=>{
const yy=startY+i*lineHeight;

if(ctx.lineWidth>0){
ctx.strokeText(t,x,yy,maxWidth);
}

ctx.fillText(t,x,yy,maxWidth);
});

ctx.restore();
}

function draw(){

ctx.clearRect(0,0,1280,720);

ctx.fillStyle=get("bgColor").value;
ctx.fillRect(0,0,1280,720);

if(bgImage){
coverImage(bgImage,0,0,1280,720);
}

// हल्का डार्क ओवरले
const gradient=ctx.createLinearGradient(0,0,1280,0);
gradient.addColorStop(0,"rgba(0,0,0,0.65)");
gradient.addColorStop(1,"rgba(0,0,0,0.05)");

ctx.fillStyle=gradient;
ctx.fillRect(0,0,1280,720);

// व्यक्ति की फोटो
if(personImage){

const size=Number(get("personSize").value);
const aspect=personImage.width/personImage.height;
const h=size;
const w=h*aspect;

ctx.save();
ctx.shadowColor="#000000";
ctx.shadowBlur=25;
ctx.drawImage(
personImage,
Number(get("personX").value)-w/2,
Number(get("personY").value)-h,
w,h
);
ctx.restore();
}

const x=Number(get("textX").value);
const size=Number(get("fontSize").value);

drawText(
get("heading").value,
Number(get("headingY").value),
get("mainColor").value,
size,x
);

drawText(
get("subheading").value,
Number(get("subY").value),
get("subColor").value,
size*0.72,x
);

drawText(
get("third").value,
Number(get("thirdY").value),
get("thirdColor").value,
size*0.60,x
);

}

ids.forEach(id=>{
get(id).addEventListener("input",draw);
get(id).addEventListener("change",draw);
});

function downloadImage(){

draw();

canvas.toBlob(blob=>{

if(!blob){
alert("Image export failed!");
return;
}

const url=URL.createObjectURL(blob);
const link=document.createElement("a");

link.download="Digital-Mitrapal-Thumbnail.png";
link.href=url;
link.click();

setTimeout(()=>URL.revokeObjectURL(url),1000);

},"image/png");

}

function resetTool(){

bgImage=null;
personImage=null;

get("bgUpload").value="";
get("personUpload").value="";

get("heading").value="अपना AI TOOL बनाएं";
get("subheading").value="बिना एक रुपया खर्च किए!";
get("third").value="ONLINE EARNING";

get("mainColor").value="#ffff00";
get("subColor").value="#ffffff";
get("thirdColor").value="#00ffcc";
get("fontSize").value=75;
get("outlineWidth").value=6;
get("outlineColor").value="#000000";
get("bgColor").value="#172554";

get("headingY").value=280;
get("subY").value=400;
get("thirdY").value=520;
get("textX").value=640;

get("personSize").value=420;
get("personX").value=1050;
get("personY").value=600;

get("fontStyle").value="Arial";
get("align").value="center";

draw();
}

draw();

</script>

</body>
</html>
